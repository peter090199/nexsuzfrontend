  <style>
    .custom-search-bar {
      width: 100%;
      max-width: 600px;
      border-radius: 50px;
      border: 1px solid #007bff;
    }

    .custom-search-bar input {
      border-radius: 50px;
    }

    .custom-search-bar .input-group-append .btn {
      border-radius: 50px;
      background-color: #007bff;
      color: white;
    }

    .custom-search-bar .input-group-append .btn:hover {
      background-color: #0056b3;
    }

    .custom-search-bar input::placeholder {
      font-style: italic;
    }

    .dropdown-menu {
      background-color: white;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .dropdown-item:hover {
      background-color: #f1f1f1;
      cursor: pointer;
    }

    .custom-search-bar {
      width: 100%;
      max-width: 480px;
      border-radius: 8px;
      border: 2px solid #007bff;
      /* Blue border */
    }

    .custom-search-bar input {
      border-radius: 8px;
      /* Rounded corners for input */
    }

    .custom-search-bar .input-group-append .btn {
      border-radius: 8px;
      /* Rounded corners for button */
      background-color: #007bff;
      color: white;
    }

    .custom-search-bar .input-group-append .btn:hover {
      background-color: #0056b3;
    }

    .custom-search-bar input::placeholder {
      font-style: italic;
    }

    /* Spinner style */
    .spinner-border {
      width: 3rem;
      height: 3rem;
      color: #06468a;
    }

    /* Mobile Specific Styles */
    @media (max-width: 767px) {
      .custom-search-bar {
        max-width: 100%;
        /* Full width on mobile */
        padding: 0px;
        /* Add padding for better spacing */
        margin-top: 30px;
      }

      .dropdown-menu {
        max-height: 150px;
        /* Reduce max-height for mobile */
        position: absolute;
        width: 100%;
        z-index: 999;
      }
    }

    .material-symbols-outlined {
      font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
    }

    /* Hide the spinner after a short delay */
    .loading-overlay {
      display: flex;
      align-items: center;
      justify-content: center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 10px, 20px, 30px, 40px;
      background-image: none;
      background-clip: padding-box, border-box;
      box-shadow: 1px 2px 4px rgba(4, 71, 172, 0.1);
      color: rgb(20, 4, 250);
      font-family: Verdana, Geneva, Tahoma, sans-serif;
      line-height: 1.2;
      margin: 0;
      padding: 0;
      z-index: 1000;
    }
  </style>

<body class="mat-typography">

  <section>
    <app-root>
      <!-- startup splash: replaced by the app the moment it starts (the logo is pale, so it sits on the brand navy) -->
      <div id="nx-boot" role="status" aria-label="Loading NEXSUZ">
        <div class="nxb-logo"><span class="nxb-ring"></span><img src="assets/images/logo.png" alt="" width="72" height="72"></div>
        <div class="nxb-word">NEXSUZ</div>
        <div class="nxb-bar"><i></i></div>
      </div>
      <style>
        /* fluid: sizes follow the screen, safe areas respected, height from the visible viewport (dvh) */
        #nx-boot { --s: clamp(88px, 28vmin, 132px); position: fixed; inset: 0; z-index: 2147483000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(10px, 3vmin, 20px);
          height: 100vh; height: 100dvh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; overflow: hidden;
          background: radial-gradient(120% 80% at 15% 0%, rgba(122,90,248,.35), transparent 55%), radial-gradient(100% 70% at 100% 100%, rgba(10,102,194,.45), transparent 60%), linear-gradient(180deg, #0a1f3d, #0b2c57 55%, #08254a);
          font-family: Verdana, Geneva, Tahoma, sans-serif; -webkit-text-size-adjust: 100%; }
        #nx-boot .nxb-logo { position: relative; width: var(--s); height: var(--s); display: flex; align-items: center; justify-content: center; flex: none; }
        #nx-boot .nxb-logo img { width: 62%; height: 62%; object-fit: contain; filter: drop-shadow(0 0 14px rgba(112,181,249,.75)); animation: nxb-pulse 2s ease-in-out infinite; }
        #nx-boot .nxb-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(255,255,255,.12); border-top-color: #70b5f9; border-right-color: #a78bfa; animation: nxb-spin 1.1s linear infinite; }
        #nx-boot .nxb-word { font-size: clamp(16px, 4.6vmin, 22px); font-weight: 700; letter-spacing: .38em; padding-left: .38em; color: #cfe3fb; text-align: center; }
        #nx-boot .nxb-bar { width: min(220px, 62vw); height: 4px; border-radius: 999px; background: rgba(255,255,255,.14); overflow: hidden; }
        #nx-boot .nxb-bar i { display: block; width: 40%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #70b5f9, #a78bfa); animation: nxb-slide 1.3s ease-in-out infinite; }
        @keyframes nxb-spin { to { transform: rotate(360deg); } }
        @keyframes nxb-pulse { 0%,100% { transform: scale(.94); opacity: .85; } 50% { transform: scale(1.06); opacity: 1; } }
        @keyframes nxb-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(270%); } }
        /* landscape phones: little height, so the logo and word sit side by side */
        @media (max-height: 440px) and (orientation: landscape) { #nx-boot { --s: 72px; flex-direction: row; gap: 20px; } #nx-boot .nxb-bar { display: none; } }
        @media (prefers-reduced-motion: reduce) { #nx-boot .nxb-logo img, #nx-boot .nxb-ring, #nx-boot .nxb-bar i { animation: none; } #nx-boot .nxb-bar i { width: 100%; opacity: .6; } }
      </style>
    </app-root>
  </section>

</body>

</html>
