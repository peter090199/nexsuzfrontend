<div class="left-panel">
  <div class="logo-container">
    <img src="assets/images/logo2.png" alt="logo" class="logo" />
    <h2 style="margin-top:3px;">exsuz</h2>
  </div>
</div>

<mat-card-content>
  <!-- Loading progress bar -->
  <mat-progress-bar
    *ngIf="isLoading"
    mode="indeterminate"
    color="primary"
    class="progress-bar">
  </mat-progress-bar>

  <form [formGroup]="uploadform" (ngSubmit)="onSubmit()">
    <!-- a native file input cannot be a matInput, so it lives outside mat-form-field -->
    <div class="file-field full-width">
      <label class="file-label" for="profileImage"><mat-icon>cloud_upload</mat-icon> Choose image</label>
      <input id="profileImage" type="file" (change)="onFileSelected($event)" accept="image/*" required>
      <small class="file-hint">{{ selectedFile ? selectedFile.name : 'Required: a JPEG or PNG image.' }}</small>
    </div>

    <div class="button-end">
      <button mat-raised-button color="primary" type="submit" [disabled]="isLoading">Upload CV Image</button>
      <button mat-raised-button color="warn" [mat-dialog-close]="true" [disabled]="isLoading">Cancel</button>
    </div>
  </form>
</mat-card-content>
<mat-card-footer></mat-card-footer>
