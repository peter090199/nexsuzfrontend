<!-- one row, used by every tab -->
<ng-template #personRow let-person>
  <mat-list-item>
    <a class="person-link" [routerLink]="profileRoute(person.code)" (click)="close()" [attr.aria-label]="'View profile of ' + person.fullname">
      <img matListAvatar [src]="person.photo_pic || 'assets/images/default.png'" alt="{{person.fullname}}" />
    </a>
    <a matLine class="person-name" [routerLink]="profileRoute(person.code)" (click)="close()">{{ person.fullname }}</a>
    <a mat-stroked-button color="primary" class="view-profile-btn" [routerLink]="profileRoute(person.code)" (click)="close()">
      <mat-icon>person</mat-icon> View profile
    </a>
  </mat-list-item>
</ng-template>

<mat-tab-group>

  <!-- All Reactions Tab -->
  <mat-tab [label]="'All ' + totalCount">
    <mat-list>
      <ng-container *ngFor="let person of allPersons">
        <ng-container *ngTemplateOutlet="personRow; context: { $implicit: person }"></ng-container>
      </ng-container>
    </mat-list>
  </mat-tab>

  <!-- Individual Reaction Tabs -->
  <mat-tab *ngFor="let reactionGroup of react" [label]="reactionLabel(reactionGroup)">
    <mat-list>
      <ng-container *ngFor="let person of reactionGroup.person">
        <ng-container *ngTemplateOutlet="personRow; context: { $implicit: person }"></ng-container>
      </ng-container>
    </mat-list>
  </mat-tab>

</mat-tab-group>
