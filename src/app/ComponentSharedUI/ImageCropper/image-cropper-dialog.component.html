<div class="cropper" tabindex="-1">
  <div class="head">
    <h2>{{ data.title }}</h2>
    <button type="button" mat-icon-button (click)="cancel()" [disabled]="saving" aria-label="Close"><mat-icon>close</mat-icon></button>
  </div>

  <p class="hint" *ngIf="ready && !failed">Drag the photo to reposition it. Use the slider to zoom.</p>
  <p class="hint warn" *ngIf="ready && small">This photo is quite small, so it may look soft. A larger photo gives a sharper result.</p>

  <div class="error" *ngIf="failed" role="alert">
    <mat-icon>error_outline</mat-icon> This file could not be read as a picture. Please choose a different image.
  </div>

  <div class="loading" *ngIf="!ready && !failed"><mat-spinner diameter="32"></mat-spinner></div>

  <div class="stage-wrap" *ngIf="ready">
    <div #stage class="stage" [class.circle]="isCircle" [style.width.px]="box.width" [style.height.px]="box.height"
      (pointerdown)="onPointerDown($event)" (pointermove)="onPointerMove($event)" (pointerup)="onPointerUp($event)"
      (pointercancel)="onPointerUp($event)" (wheel)="onWheel($event)" tabindex="0" role="img"
      aria-label="Crop area. Drag to reposition, use plus and minus to zoom.">
      <img [src]="safeUrl" alt="" draggable="false" [style.width.px]="imgW" [style.height.px]="imgH"
        [style.transform]="transform" />
      <!-- the window: round for a profile photo, plain frame for the cover -->
      <div class="mask" [class.circle]="isCircle"></div>
    </div>
  </div>

  <div class="zoom" *ngIf="ready">
    <button type="button" mat-icon-button (click)="zoomBy(1 / 1.15)" [disabled]="saving" aria-label="Zoom out"><mat-icon>remove</mat-icon></button>
    <input type="range" min="0" max="100" step="0.5" [value]="slider" (input)="onSlider($any($event.target).value)" [disabled]="saving"
      aria-label="Zoom" />
    <button type="button" mat-icon-button (click)="zoomBy(1.15)" [disabled]="saving" aria-label="Zoom in"><mat-icon>add</mat-icon></button>
    <button type="button" class="reset" (click)="reset()" [disabled]="saving">Reset</button>
  </div>

  <div class="actions">
    <button type="button" mat-stroked-button (click)="cancel()" [disabled]="saving">Cancel</button>
    <button type="button" mat-flat-button color="primary" (click)="save()" [disabled]="!ready || failed || saving">
      <mat-spinner *ngIf="saving" diameter="18"></mat-spinner>
      <span *ngIf="!saving">Save</span>
    </button>
  </div>
</div>
