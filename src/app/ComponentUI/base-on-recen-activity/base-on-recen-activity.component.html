<section class="section">

  <!-- loading -->
  <div class="pc-grid" *ngIf="isLoading; else recentActivityList">
    <app-person-card *ngFor="let _ of skeletonRows" [skeleton]="true"></app-person-card>
  </div>

  <ng-template #recentActivityList>
    <p class="no-data" *ngIf="peopleRecentActivity.length === 0">No data found</p>

    <div class="pc-grid">
      <app-person-card *ngFor="let person of peopleRecentActivity"
        [name]="person.fullname"
        [photo]="person.photo_pic"
        [cover]="person.coverphoto"
        [profession]="person.profession"
        [label]="'Based on your recent ' + person.source"
        [online]="person.is_online == 1"
        [status]="person.follow_status"
        [showActions]="currentUserCode != person.code"
        [code]="person.code"
        [roleCode]="person.role_code"
        [link]="person.role_code === 'DEF-USERS'
          ? ['/' + sharedRoutines.getRole() + '/profile', person.code]
          : ['/' + sharedRoutines.getRole() + '/client_profile', person.code]"
        (connect)="feature.can('NETWORK_FEED')
          ? AddConnect(person.code, person.fullname, person.follow_status, person.id)
          : sharedRoutines.openUpgradeModal()"
        (blocked)="removeBlocked(person.code)">
      </app-person-card>
    </div>
  </ng-template>

</section>
