<!-- My Network: clean light layout, main column on the LEFT and the invitations rail on the RIGHT -->
<section class="mynet">
  <main class="mynet-main">
    <div *ngIf="isLoading" class="spinner-wrapper">
      <mat-spinner diameter="40"></mat-spinner>
    </div>

    <div class="panel" *ngIf="!isLoading">
      <h2 class="panel-title">People you may know</h2>
      <div class="list-wrapper">
        <app-user-and-recruiter></app-user-and-recruiter>
      </div>
    </div>

    <div class="panel" *ngIf="!isLoading">
      <h2 class="panel-title">Based on recent activity</h2>
      <div class="list-wrapper">
        <app-base-on-recen-activity></app-base-on-recen-activity>
      </div>
    </div>
  </main>

  <!-- RAIL (right): invitations to answer -->
  <aside class="mynet-side" aria-label="Invitations">
    <div class="panel side-panel">
      <h2 class="panel-title"><mat-icon>mail</mat-icon> Invitations</h2>
      <div class="list-wrapper">
        <div class="grid">
          <app-invites></app-invites>
        </div>
      </div>
    </div>
  </aside>

</section>
