<section class="section" (scroll)="onScroll($event)">

    <!-- loading -->
    <div class="pc-grid" *ngIf="isLoading; else profileList">
        <app-person-card *ngFor="let item of skeletonRows" [skeleton]="true"></app-person-card>
    </div>

    <ng-template #profileList>
        <p class="no-data" *ngIf="!people.length">No data found</p>

        <div class="pc-grid">
            <app-person-card *ngFor="let person of people"
                [name]="person.fullname"
                [photo]="person.photo_pic"
                [cover]="person.coverphoto"
                [profession]="person.profession"
                [label]="person.source === 'suggested' ? 'Based on your profile' : 'Suggested for you'"
                [online]="person.is_online == 1"
                [status]="person.follow_status"
                [showActions]="currentUserCode != person.code"
                [code]="person.code"
                [roleCode]="person.role_code"
                [link]="sharedRoutines.getProfileRoute(person.code)"
                (connect)="AddConnect(person.code, person.fullname, person.follow_status, person.id)"
                (blocked)="removeBlocked(person.code)">
            </app-person-card>
        </div>
    </ng-template>

</section>
