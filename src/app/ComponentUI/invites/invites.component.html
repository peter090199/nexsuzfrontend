<section class="section">

    <!-- loading -->
    <div class="pc-grid" *ngIf="isLoading && !peopleInvites.length; else invitesTemplate">
        <app-person-card *ngFor="let _ of skeletonRows" [skeleton]="true"></app-person-card>
    </div>

    <ng-template #invitesTemplate>
        <p class="no-data" *ngIf="!peopleInvites || peopleInvites.length === 0">No data found</p>

        <div class="pc-grid" *ngIf="peopleInvites && peopleInvites.length > 0" (scroll)="onScroll($event)">
            <app-person-card *ngFor="let person of peopleInvites"
                [name]="person.fullname"
                [photo]="person.photo_pic"
                [cover]="person.coverphoto"
                [profession]="person.profession"
                [label]="'Wants to connect with you'"
                [online]="person.is_online == 1"
                [status]="person.follow_status === 'pending' ? 'invite' : person.follow_status"
                [showActions]="currentUserCode != person.follower_code"
                [code]="person.follower_code"
                [roleCode]="person.role_code"
                [link]="person.role_code === 'DEF-USERS'
                    ? ['/' + sharedRoutines.getRole() + '/profile', person.follower_code]
                    : ['/' + sharedRoutines.getRole() + '/client_profile', person.follower_code]"
                (connect)="ConnectInvites(person.follower_code, person.fullname)">
            </app-person-card>
        </div>
    </ng-template>

</section>
