<!-- LinkedIn-style feed: left profile/shortcuts | center feed | right suggestions -->
<div class="home-page">
  <div class="nx-container home-grid">

    <!-- LEFT: profile summary + shortcuts -->
    <aside class="home-left" *ngIf="!isMobile">

      <!-- loading skeleton -->
      <div class="nx-card profile-card skeleton-card" *ngIf="isLoading">
        <div class="skeleton-avatar"></div>
        <div class="skeleton-line medium"></div>
        <div class="skeleton-line short"></div>
        <div class="skeleton-btn"></div>
      </div>

      <div class="nx-card profile-card" *ngIf="!isLoading">
        <div class="profile-cover"></div>

        <div class="profile-avatar">
          <div class="avatar-container" (click)="uploadPic()" title="Change profile picture">
            <img *ngIf="profile_pic?.photo_pic; else defaultAvatar" [src]="profile_pic.photo_pic" nxFallback class="profile-pic"
              alt="Profile picture" />
            <ng-template #defaultAvatar>
              <img src="assets/images/default.png" class="profile-pic" alt="Profile picture" />
            </ng-template>
          </div>
        </div>

        <div class="profile-info">
          <h3 class="profile-name">{{ profiles?.fname }} {{ profiles?.lname }}</h3>
          <p class="profile-profession">{{ profiles?.profession }}</p>
        </div>

        <div class="profile-actions">
          <button mat-flat-button color="primary" class="profile-btn"
            [routerLink]="['/' + sharedRoutines.getRole() + '/profile', profiles?.code]">
            View Profile
          </button>
          <button mat-stroked-button color="primary" class="profile-btn" (click)="printCV()"
            *ngIf="showDefUserButtons">
            View CV
          </button>
        </div>
      </div>

      <!-- Shortcuts (always shown: they need no data) -->
      <nav class="nx-card shortcuts" aria-label="Shortcuts">
        <h4 class="nx-card-title">Shortcuts</h4>
        <a class="shortcut" *ngFor="let s of shortcuts; trackBy: trackShortcut" [routerLink]="[s.link]">
          <mat-icon>{{ s.icon }}</mat-icon> {{ s.label }}
        </a>
      </nav>
    </aside>

    <!-- CENTER: create post + feed -->
    <main class="home-center">

      <!-- phones: the left column is not shown, so the shortcuts sit at the top of the feed -->
      <nav class="shortcuts-chips" *ngIf="isMobile" aria-label="Shortcuts">
        <a class="chip" *ngFor="let s of shortcuts; trackBy: trackShortcut" [routerLink]="[s.link]">
          <mat-icon>{{ s.icon }}</mat-icon><span>{{ s.label }}</span>
        </a>
      </nav>

      <!-- global announcements from the administrators: for everyone, whatever their plan or connections -->
      <app-announcements></app-announcements>

      <ng-container *appFeature="FEATURE.NETWORK_FEED">
      <section class="nx-card post-top-container" *ngIf="!isLoading">
        <div class="input-section">
          <img class="composer-avatar" [src]="profile_pic?.photo_pic || 'assets/images/default.png'" nxFallback alt="" />
          <input type="text" placeholder="Start a post" aria-label="Create a post" class="post-input" readonly
            (click)="createPost()" />
        </div>

        <div class="actions-section">
          <button type="button" class="action-btn photo" (click)="createPost()">
            <mat-icon>image</mat-icon> Photo
          </button>
          <button type="button" class="action-btn video" (click)="createPost()">
            <mat-icon>videocam</mat-icon> Video
          </button>
          <button type="button" class="action-btn event" (click)="createPost()">
            <mat-icon>event</mat-icon> Event
          </button>
        </div>
      </section>
      </ng-container>

      <app-public-post></app-public-post>
    </main>

    <!-- RIGHT: suggestions -->
    <aside class="home-right nx-sticky" *ngIf="!isMobile">
      <section class="nx-card right-column">
        <h4 class="nx-card-title">People you may know</h4>

        <ng-container *ngIf="!isLoading && users?.length > 0; else noData">
          <div *ngFor="let user of users" class="client-item">

            <img [src]="user.photo_pic || 'assets/images/default.png'" nxFallback alt="" class="mat-avatar" />

            <div class="client-info">
              <a class="custom-title" [routerLink]="
                  user.role_code === 'DEF-USERS'
                    ? ['/' + sharedRoutines.getRole() + '/profile', user.code]
                    : ['/' + sharedRoutines.getRole() + '/client_profile', user.code]
                ">
                {{ user.fullname }}
              </a>
            </div>

            <div class="client-action" *ngIf="currentUserCode != user.code">
              <app-block-button [role]="user.role_code" [code]="user.code" [name]="user.fullname" (blocked)="removeBlocked(user.code)"></app-block-button>
              <button mat-stroked-button [color]="user.follow_status === 'accepted' ? 'accent' : 'primary'"
                class="connect-btn" (click)="AddConnect(user.code, user.fullname, user.follow_status, user.id)">
                {{ user.follow_status === 'not_following' ? 'Connect' : 'Connected' }}
              </button>
            </div>

          </div>
        </ng-container>

        <ng-template #noData>
          <p class="no-data-text nx-muted" *ngIf="!isLoading">No suggestions available.</p>
        </ng-template>
      </section>
    </aside>

  </div>
</div>
