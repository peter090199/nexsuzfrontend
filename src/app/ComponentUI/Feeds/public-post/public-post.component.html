<section class="section">
  <div class="feed-wrapper">
    <button *ngIf="newPostsAvailable" mat-raised-button color="primary" (click)="prependNewPosts()">
      New Posts
    </button>

  <div class="feed-state" *ngIf="isLoadingPosts">
    <mat-spinner diameter="32"></mat-spinner>
    <span>Loading your feed…</span>
  </div>
  <div class="feed-state error" *ngIf="!isLoadingPosts && loadError" role="alert">
    <mat-icon>error_outline</mat-icon>
    <span>{{ loadError }}</span>
    <button mat-stroked-button color="primary" (click)="loadPosts()">Try again</button>
  </div>
  <div class="feed-state" *ngIf="!isLoadingPosts && !loadError && !posts.length">
    <mat-icon>forum</mat-icon>
    <strong>No posts yet</strong>
    <span>Share an update or connect with people to see posts here.</span>
  </div>

  <mat-card *ngFor="let post of posts">
    <div class="post-header">

      <img class="avatar" [src]="post.photo_pic || 'assets/images/default.png'" nxFallback [alt]="post.fullname">

      <div class="user-info">
        <h4 class="name">
          {{ post.fullname }}
        </h4>

        <div class="meta">
          <small class="time">
            {{ post.created_at | date:'short' }}
          </small>
        </div>
      </div>

      <!-- options are only offered on your own posts -->
      <ng-container *ngIf="post.is_owner">
      <button mat-icon-button class="more-btn" [matMenuTriggerFor]="menu" class="menu-btn" aria-label="Post Options">
        <mat-icon>more_horiz</mat-icon>
      </button>

      <mat-menu #menu="matMenu">
        <button mat-menu-item (click)="onEditPost(post)">Edit</button>
        <button mat-menu-item (click)="onDelete(post)" [disabled]="isLoading">
          <ng-container *ngIf="!isLoading; else deletingTpl">Delete</ng-container>
          <ng-template #deletingTpl>
            <mat-progress-spinner diameter="20" mode="indeterminate" color="warn"></mat-progress-spinner>
          </ng-template>
        </button>
      </mat-menu>
      </ng-container>

    </div>
    <!-- CAPTION -->
    <p style="font-family: Verdana, Geneva, Tahoma, sans-serif; color: #413f3f; font-size: 14px; margin-bottom: 20px; text-align: justify;">
      {{ post.expanded ? post.caption : (post.caption | slice:0:200) }}
      <a *ngIf="post.caption?.length > 200" (click)="post.expanded = !post.expanded">
        {{ post.expanded ? 'See less' : 'See more' }}
      </a>
    </p>

    <!-- IMAGES -->
    <div class="post-gallery" *ngIf="post.images?.length"
      [attr.data-count]="post.images.length > 4 ? 4 : post.images.length">
      <figure *ngFor="let img of post.images | slice:0:4; let i = index" tabindex="0" role="button"
        [attr.aria-label]="'Open picture ' + (i + 1) + ' of ' + post.images.length"
        (click)="openImages(post.images, i); $event.stopPropagation()"
        (keydown.enter)="openImages(post.images, i); $event.preventDefault()">
        <img [src]="img.path_url" alt="Post image" loading="lazy">
        <figcaption class="more" *ngIf="i === 3 && post.images.length > 4">+{{ post.images.length - 4 }}</figcaption>
      </figure>
    </div>

    <!-- VIDEOS -->
    <video *ngFor="let v of post.videos" #videoEl controls [src]="v.path_url">
    </video>

    <!-- REACTION AND COMMENT COUNTS -->
    <div class="counts" *ngIf="post.reaction_summary?.total || post.comments_count">
      <app-reaction-summary [summary]="post.reaction_summary" (openList)="openReactions(post.id)"></app-reaction-summary>
      <span class="spacer"></span>
      <button type="button" class="count-btn" *ngIf="post.comments_count" (click)="toggleComments(post)">
        {{ post.comments_count }} {{ post.comments_count === 1 ? 'comment' : 'comments' }}
      </button>
    </div>

    <!-- ACTIONS -->
    <div class="actions">
      <app-reaction-button [myReaction]="post.my_reaction" [disabled]="post.reactBusy" (react)="onReact(post, $event)"
        (unreact)="onUnreact(post)"></app-reaction-button>
      <button type="button" class="act-btn" [class.active]="post.showComments" (click)="toggleComments(post)"
        [attr.aria-expanded]="!!post.showComments">
        <mat-icon>chat_bubble_outline</mat-icon> Comment
      </button>
    </div>

    <!-- COMMENTS -->
    <app-post-comments *ngIf="post.showComments" [postUuid]="post.posts_uuid"
      (countChange)="post.comments_count = $event"></app-post-comments>

  </mat-card>

  <div class="feed-more" *ngIf="hasMore && !loadError">
    <button mat-stroked-button color="primary" (click)="loadMore()" [disabled]="loadingMore">
      {{ loadingMore ? 'Loading…' : 'Load more posts' }}
    </button>
  </div>
</div>
</section>
