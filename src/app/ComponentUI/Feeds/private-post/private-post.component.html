<div class="middle-column" infiniteScroll (scrolled)="loadMorePosts()">

  <!-- Skeleton Loader -->
  <ng-container *ngIf="isLoading && posts.length === 0">
    <mat-card *ngFor="let item of [].constructor(perPage)" class="skeleton-post"
      style="width:600px; height:200px; margin-bottom:20px; background:#ddd; border-radius:8px">
      <mat-card-header class="skeleton-avatar"></mat-card-header>
      <div class="skeleton-info">
        <div class="skeleton-line medium"></div>
        <div class="skeleton-line medium"></div>
      </div>
      <div class="skeleton-btn medium"></div>
    </mat-card>
  </ng-container>

  <!-- New Posts Button -->
  <div class="load-post-container" *ngIf="newPostsAvailable">
    <button mat-raised-button color="primary" (click)="prependNewPosts()" [disabled]="isLoading">
      <span *ngIf="!isLoading">See New Posts 🔄</span>
      <mat-spinner *ngIf="isLoading" diameter="24" color="accent"></mat-spinner>
    </button>
  </div>

  <button mat-stroked-button color="primary" type="button" class="new-post" *ngIf="isOwnProfile" (click)="createPost()">
    <mat-icon>edit_square</mat-icon> Create a post
  </button>
  <p class="no-posts" *ngIf="!isLoading && !posts.length">No posts to show.</p>

  <!-- Feed -->
  <div *ngFor="let post of posts; trackBy: trackByPostId" class="post-card feed-container">

    <!-- Post Header -->
    <div class="pc-head" *ngIf="profiles">
      <div class="pc-avatar">
        <img [src]="avatarOf(post)" nxFallback alt="Author photo">
      </div>
      <div class="pc-meta">
        <h3 class="pc-name" data-no-translate>{{ post.fullname }}</h3>
        <div class="pc-sub">
          <span>{{ timeAgo(post.created_at) }}</span>
          <span class="pc-dot" aria-hidden="true">·</span>
          <span class="pc-privacy" [ngClass]="'p' + privacyOf(post.status).value" [matTooltip]="privacyOf(post.status).hint"
            [attr.aria-label]="'Visible to: ' + privacyOf(post.status).label">
            <mat-icon>{{ privacyOf(post.status).icon }}</mat-icon>
            {{ privacyOf(post.status).label }}
          </span>
        </div>
      </div>

      <!-- options are only offered on your own posts (the API also rejects anyone else) -->
      <ng-container *ngIf="post.is_owner">
        <button mat-icon-button [matMenuTriggerFor]="menu" class="pc-menu-btn" aria-label="Post options">
          <mat-icon>more_horiz</mat-icon>
        </button>

        <mat-menu #menu="matMenu">
          <button mat-menu-item (click)="onEditPost(post)"><mat-icon>edit</mat-icon> Edit post</button>
          <button mat-menu-item (click)="onDelete(post)" [disabled]="isLoading">
            <ng-container *ngIf="!isLoading; else deletingTpl"><mat-icon>delete_outline</mat-icon> Delete post</ng-container>
            <ng-template #deletingTpl>
              <mat-progress-spinner diameter="20" mode="indeterminate" color="warn"></mat-progress-spinner>
            </ng-template>
          </button>
        </mat-menu>
      </ng-container>
    </div>

    <!-- Caption -->
    <div class="post-caption pc-caption">
      <p data-no-translate>{{ post.expanded ? post.caption : (post.caption | slice:0:800) + (post.caption.length > 800 ? '...' : '') }}
      </p>
      <a *ngIf="post.caption.length > 800" (click)="post.expanded = !post.expanded" class="see-more">
        {{ post.expanded ? 'See Less' : 'See More' }}
      </a>
      <app-see-translation [text]="post.caption"></app-see-translation>
    </div>

    <!-- Images: 1 = full width, 2 = halves, 3 = one large + two, 4+ = 2x2 with a "+N" tile -->
    <div *ngIf="post.images?.length" class="pc-media">
      <div class="pc-grid" [ngClass]="'n' + (post.images.length > 4 ? 4 : post.images.length)">
        <button type="button" class="pc-cell" *ngFor="let image of post.images | slice:0:4; let i = index"
          (click)="openImages(post.images, i); $event.stopPropagation()" [attr.aria-label]="'Open photo ' + (i + 1) + ' of ' + post.images.length">
          <img [src]="image.path_url" loading="lazy"
            (error)="$any($event.target).closest('.pc-cell').style.display = 'none'" alt="Post image">
          <span class="pc-more" *ngIf="i === 3 && post.images.length > 4">+{{ post.images.length - 4 }}</span>
        </button>
      </div>
    </div>

    <!-- Videos -->
    <div *ngIf="post.videos?.length" class="video-gallery">
      <video *ngFor="let video of post.videos" controls [src]="video.path_url"></video>
    </div>

    <!-- Reaction + comment counts -->
    <div class="pc-counts" *ngIf="post.reaction_summary?.total || post.comments_count">
      <app-reaction-summary [summary]="post.reaction_summary" (openList)="openReactionsModal(post.id)"></app-reaction-summary>
      <span class="pc-spacer"></span>
      <button type="button" class="count-btn" *ngIf="post.comments_count" (click)="toggleComments(post)">
        {{ post.comments_count }} {{ post.comments_count === 1 ? 'comment' : 'comments' }}
      </button>
    </div>

    <!-- Actions: shared reaction button (hover / long-press picker, six reactions) + comments -->
    <div class="post-footer pc-actions">
      <app-reaction-button [myReaction]="post.my_reaction" [disabled]="post.reactBusy"
        (react)="onReact(post, $event)" (unreact)="onUnreact(post)"></app-reaction-button>
      <button mat-button (click)="toggleComments(post)" [class.active]="post.showComments" [attr.aria-expanded]="!!post.showComments">
        <mat-icon>chat_bubble_outline</mat-icon> Comment
      </button>
      <!-- only Public posts can be passed on -->
      <button mat-button type="button" *ngIf="shareUrl && privacyOf(post.status).value === 1" (click)="sharePost(post)">
        <mat-icon>{{ shareNotice === post.id ? 'check' : 'share' }}</mat-icon> {{ shareNotice === post.id ? 'Copied' : 'Share' }}
      </button>
    </div>

    <!-- COMMENTS: shared section (replies, reactions, edit, delete), same as Home -->
    <app-post-comments *ngIf="post.showComments" [postUuid]="post.posts_uuid"
      (countChange)="post.comments_count = $event"></app-post-comments>

  </div>

  <button mat-button color="primary" type="button" class="new-post" *ngIf="posts.length && !allLoaded && !isLoading" (click)="loadMorePosts()">
    Load more
  </button>

  <!-- Loading More -->
  <div class="loading-more" *ngIf="isLoading && posts.length">
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  </div>

</div>
